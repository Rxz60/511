<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Editor</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
scroll-behavior:smooth;
}

body{
min-height:100vh;
background:#050505;
color:#fff;
font-family:Arial,sans-serif;
padding:25px;
}

.container{
width:100%;
max-width:1100px;
margin:auto;
background:#0b0b0b;
border:1px solid #202020;
border-radius:20px;
padding:25px;
box-shadow:0 0 50px rgba(0,0,0,.6);
}

h1{
text-align:center;
font-size:30px;
margin-bottom:8px;
}

.subtitle{
text-align:center;
color:#777;
margin-bottom:25px;
}

.drop{
height:130px;
border:2px dashed #303030;
border-radius:16px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
cursor:pointer;
transition:.2s;
margin-bottom:15px;
}

.drop:hover{
background:#111;
border-color:#666;
}

.drop span{
font-size:38px;
margin-bottom:8px;
}

.drop p{
color:#999;
font-size:14px;
}

textarea{
display:block;
width:100%;
height:520px;
min-height:300px;
resize:vertical;
background:#050505;
border:1px solid #292929;
border-radius:15px;
color:#fff;
padding:18px;
font-family:Consolas,"Courier New",monospace;
font-size:14px;
line-height:1.6;
outline:none;
direction:ltr;
text-align:left;
tab-size:4;
white-space:pre;
overflow:auto;
}

textarea:focus{
border-color:#555;
}

.info{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin:10px 0 18px;
color:#777;
font-size:13px;
direction:rtl;
}

.section{
background:#111;
border:1px solid #222;
border-radius:16px;
padding:18px;
margin-top:15px;
}

.title{
font-size:18px;
font-weight:bold;
margin-bottom:15px;
}

.inputs{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
}

input{
width:100%;
height:50px;
background:#070707;
border:1px solid #292929;
border-radius:12px;
padding:0 15px;
color:#fff;
font-size:14px;
outline:none;
}

input:focus{
border-color:#555;
}

button{
width:100%;
height:50px;
border:0;
border-radius:12px;
margin-top:14px;
background:#fff;
color:#000;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:.2s;
}

button:hover{
background:#ddd;
transform:translateY(-1px);
}

.buttons{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.buttons button{
margin-top:0;
}

.dark{
background:#151515;
border:1px solid #292929;
color:#fff;
}

.gray{
background:#101010;
border:1px solid #292929;
color:#aaa;
}

.result{
margin-top:20px;
}

.result textarea{
height:520px;
}

.status{
margin-top:12px;
text-align:center;
color:#888;
font-size:13px;
min-height:18px;
}

.topButton{
position:fixed;
bottom:20px;
left:20px;
width:52px;
height:52px;
border-radius:50%;
background:#151515;
border:1px solid #333;
color:#fff;
font-size:22px;
display:none;
z-index:9999;
box-shadow:0 0 20px rgba(0,0,0,.6);
}

.topButton:hover{
background:#222;
}

@media(max-width:700px){

body{
padding:12px;
}

.container{
padding:15px;
}

.inputs{
grid-template-columns:1fr;
}

.buttons{
grid-template-columns:1fr;
}

textarea{
height:400px;
font-size:13px;
}

.result textarea{
height:400px;
}

h1{
font-size:25px;
}
}
</style>
</head>

<body id="top">

<div class="container">

<h1>Code Editor</h1>

<div class="subtitle">
رفع وتعديل واستبدال وفك ترميز الأكواد
</div>

<label class="drop" for="fileInput">

<span>📁</span>

<p>اضغط هنا لرفع ملف الكود</p>

<input id="fileInput" type="file" hidden>

</label>

<textarea id="code" spellcheck="false" placeholder="الصق الكود هنا..."></textarea>

<div class="info">
<span id="lineCount">الأسطر: 0</span>
<span id="charCount">الأحرف: 0</span>
</div>

<div class="section">

<div class="title">
أدوات الكود
</div>

<div class="buttons">

<button id="decode">
فك الترميز
</button>

<button class="dark" id="undo">
رجوع
</button>

<button class="dark" id="redo">
إعادة
</button>

</div>

</div>

<div class="section">

<div class="title">
استبدال كود
</div>

<div class="inputs">

<input id="oldWord" type="text" placeholder="الكلمة الموجودة">

<input id="newWord" type="text" placeholder="الكلمة الجديدة">

</div>

<button id="replace">
استبدال الكلمة
</button>

</div>

<div class="result">

<div class="title">
الكود المعدل
</div>

<textarea id="output" spellcheck="false" placeholder="الكود المعدل يظهر هنا..."></textarea>

<div class="info">

<span id="resultLines">الأسطر: 0</span>

<span id="replaceCount">الاستبدال: 0</span>

</div>

<button class="dark" id="useOutput">
استخدام الكود المعدل
</button>

<button class="dark" id="download">
تحميل الملف
</button>

</div>

<div class="section">

<button class="gray" id="clear">
مسح كل شيء
</button>

</div>

<div class="status" id="status"></div>

</div>

<button class="topButton" id="topButton">↑</button>

<script>
const fileInput=document.getElementById("fileInput");
const code=document.getElementById("code");
const oldWord=document.getElementById("oldWord");
const newWord=document.getElementById("newWord");
const decode=document.getElementById("decode");
const replace=document.getElementById("replace");
const undo=document.getElementById("undo");
const redo=document.getElementById("redo");
const output=document.getElementById("output");
const useOutput=document.getElementById("useOutput");
const download=document.getElementById("download");
const clear=document.getElementById("clear");
const lineCount=document.getElementById("lineCount");
const charCount=document.getElementById("charCount");
const resultLines=document.getElementById("resultLines");
const replaceCount=document.getElementById("replaceCount");
const status=document.getElementById("status");
const topButton=document.getElementById("topButton");

let selectedFileName="replaced-code.txt";
let selectedFileType="text/plain";

let history=[];
let historyPosition=-1;

history.push("");

fileInput.addEventListener("change",function(){

const file=fileInput.files[0];

if(!file){
return;
}

selectedFileName=file.name;
selectedFileType=file.type||"text/plain";

const reader=new FileReader();

reader.onload=function(){

code.value=reader.result;

history=[code.value];
historyPosition=0;

lineCount.textContent="الأسطر: "+(code.value.length?code.value.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+code.value.length;

status.textContent="تم تحميل الملف: "+file.name;

};

reader.readAsText(file);

});

code.addEventListener("input",function(){

lineCount.textContent="الأسطر: "+(code.value.length?code.value.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+code.value.length;

});

output.addEventListener("input",function(){

resultLines.textContent="الأسطر: "+(output.value.length?output.value.split(/\r\n|\r|\n/).length:0);

});

decode.addEventListener("click",function(){

const source=code.value;

if(!source){
alert("الصق الكود أو ارفع ملف أولاً");
return;
}

const pattern=/\/(\d+(?:\/\d+)+)\/?/g;

let found=0;

const decoded=source.replace(pattern,function(match,numbers){

const values=numbers.split("/");

let text="";

let valid=true;

for(let i=0;i<values.length;i++){

const number=Number(values[i]);

if(number<0||number>1114111){
valid=false;
break;
}

try{
text+=String.fromCodePoint(number);
}catch{
valid=false;
break;
}

}

if(valid&&text){
found++;
return text;
}

return match;

});

if(found===0){

status.textContent="لم يتم العثور على ترميز رقمي قابل للفك";

return;
}

history=history.slice(0,historyPosition+1);

history.push(decoded);

historyPosition++;

code.value=decoded;

output.value=decoded;

lineCount.textContent="الأسطر: "+(decoded.length?decoded.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+decoded.length;

resultLines.textContent="الأسطر: "+(decoded.length?decoded.split(/\r\n|\r|\n/).length:0);

replaceCount.textContent="تم فك: "+found;

status.textContent="تم فك "+found+" ترميز";

});

replace.addEventListener("click",function(){

const source=code.value;
const oldValue=oldWord.value;
const newValue=newWord.value;

if(!source){
alert("الصق الكود أو ارفع ملف أولاً");
return;
}

if(!oldValue){
alert("اكتب الكلمة التي تريد استبدالها");
return;
}

const parts=source.split(oldValue);
const total=parts.length-1;

if(total===0){

output.value=source;

resultLines.textContent="الأسطر: "+(source.length?source.split(/\r\n|\r|\n/).length:0);

replaceCount.textContent="تم الاستبدال: 0";

status.textContent="الكلمة غير موجودة";

return;
}

const changed=parts.join(newValue);

history=history.slice(0,historyPosition+1);

history.push(changed);

historyPosition++;

code.value=changed;

output.value=changed;

lineCount.textContent="الأسطر: "+(changed.length?changed.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+changed.length;

resultLines.textContent="الأسطر: "+(changed.length?changed.split(/\r\n|\r|\n/).length:0);

replaceCount.textContent="تم الاستبدال: "+total;

status.textContent="تم استبدال "+total+" ظهور للكلمة";

});

undo.addEventListener("click",function(){

if(historyPosition<=0){

status.textContent="لا يوجد تعديل سابق";

return;
}

historyPosition--;

code.value=history[historyPosition];

output.value=history[historyPosition];

lineCount.textContent="الأسطر: "+(code.value.length?code.value.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+code.value.length;

resultLines.textContent="الأسطر: "+(output.value.length?output.value.split(/\r\n|\r|\n/).length:0);

status.textContent="تم الرجوع للتعديل السابق";

});

redo.addEventListener("click",function(){

if(historyPosition>=history.length-1){

status.textContent="لا يوجد تعديل لإعادته";

return;
}

historyPosition++;

code.value=history[historyPosition];

output.value=history[historyPosition];

lineCount.textContent="الأسطر: "+(code.value.length?code.value.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+code.value.length;

resultLines.textContent="الأسطر: "+(output.value.length?output.value.split(/\r\n|\r|\n/).length:0);

status.textContent="تمت إعادة التعديل";

});

useOutput.addEventListener("click",function(){

if(!output.value){
return;
}

code.value=output.value;

lineCount.textContent="الأسطر: "+(code.value.length?code.value.split(/\r\n|\r|\n/).length:0);

charCount.textContent="الأحرف: "+code.value.length;

history=history.slice(0,historyPosition+1);

history.push(code.value);

historyPosition++;

status.textContent="تم نقل الكود المعدل إلى المحرر";

window.scrollTo({
top:0,
behavior:"smooth"
});

});

download.addEventListener("click",function(){

if(!output.value){
alert("لا يوجد كود لتحميله");
return;
}

const blob=new Blob(
[output.value],
{type:selectedFileType+";charset=utf-8"}
);

const url=URL.createObjectURL(blob);

const link=document.createElement("a");

link.href=url;
link.download=selectedFileName;

document.body.appendChild(link);

link.click();

document.body.removeChild(link);

setTimeout(function(){
URL.revokeObjectURL(url);
},1000);

status.textContent="تم تجهيز الملف للتحميل";

});

clear.addEventListener("click",function(){

code.value="";
output.value="";
oldWord.value="";
newWord.value="";
fileInput.value="";

history=[""];
historyPosition=0;

lineCount.textContent="الأسطر: 0";
charCount.textContent="الأحرف: 0";
resultLines.textContent="الأسطر: 0";
replaceCount.textContent="الاستبدال: 0";
status.textContent="";

selectedFileName="replaced-code.txt";
selectedFileType="text/plain";

});

window.addEventListener("scroll",function(){

if(window.scrollY>400){
topButton.style.display="block";
}else{
topButton.style.display="none";
}

});

topButton.addEventListener("click",function(){

window.scrollTo({
top:0,
behavior:"smooth"
});

});

let lastScrollPosition=0;

window.addEventListener("beforeunload",function(){

lastScrollPosition=window.scrollY;

});

</script>

</body>
</html>
