<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SP HUB | سكربتات روبلكس</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#080101;color:#fff;font-family:Tahoma,Arial;overflow-x:hidden}
body:before{content:"";position:fixed;width:600px;height:600px;top:-220px;right:-180px;background:#ff2929;filter:blur(180px);opacity:.17;z-index:-1}
body:after{content:"";position:fixed;width:550px;height:550px;bottom:-250px;left:-180px;background:#ff3b3b;filter:blur(180px);opacity:.14;z-index:-1}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.loginBox{width:390px;padding:35px;border-radius:28px;background:rgba(20,3,3,.78);border:1px solid rgba(255,80,80,.3);box-shadow:0 0 70px rgba(255,30,30,.16);backdrop-filter:blur(22px)}
.logo{text-align:center;font-size:43px;font-weight:900;color:#ff5757;text-shadow:0 0 30px #ff3030;margin-bottom:7px}
.sub{text-align:center;color:#bd8f8f;font-size:13px;margin-bottom:30px}
label{display:block;color:#ffaaaa;font-size:13px;margin-bottom:8px}
input{width:100%;height:52px;border:1px solid rgba(255,80,80,.22);border-radius:15px;background:rgba(255,255,255,.04);outline:none;color:#fff;padding:0 16px;margin-bottom:16px}
input:focus{border-color:#ff5555;box-shadow:0 0 20px rgba(255,50,50,.15)}
button{border:0;cursor:pointer}
.loginBtn,.obfuscate{width:100%;height:53px;border-radius:15px;color:#fff;font-weight:900;background:linear-gradient(135deg,#ff6a6a,#df2020);box-shadow:0 0 25px rgba(255,40,40,.25);transition:.2s}
.loginBtn:hover,.obfuscate:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(255,40,40,.45)}
.err{text-align:center;color:#ff6868;font-size:12px;margin-top:12px;min-height:15px}
.app{display:none}
.nav{height:75px;display:flex;align-items:center;justify-content:space-between;padding:0 6%;border-bottom:1px solid rgba(255,70,70,.12);background:rgba(7,1,1,.72);backdrop-filter:blur(20px);position:sticky;top:0;z-index:5}
.brand{font-size:25px;font-weight:900;color:#ff5757;text-shadow:0 0 18px rgba(255,40,40,.65)}
.account{padding:9px 14px;border-radius:12px;background:rgba(255,50,50,.06);border:1px solid rgba(255,70,70,.18);color:#ffadad;font-size:12px}
.container{width:min(1050px,92%);margin:55px auto}
.hero{text-align:center;margin-bottom:32px}
.hero h1{font-size:44px;font-weight:900}
.hero h1 span{color:#ff5555;text-shadow:0 0 30px rgba(255,30,30,.45)}
.hero p{margin-top:10px;color:#a77d7d;font-size:14px}
.panel{padding:20px;border-radius:25px;background:rgba(17,2,2,.78);border:1px solid rgba(255,70,70,.22);box-shadow:0 0 60px rgba(255,30,30,.11);backdrop-filter:blur(20px)}
.head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}
.title{font-weight:900;color:#ffaaaa}
.state{font-size:11px;color:#ff7777;padding:7px 11px;border-radius:10px;background:rgba(255,50,50,.06)}
textarea{width:100%;height:410px;background:#070202;color:#ffbcbc;border:1px solid rgba(255,80,80,.18);border-radius:18px;outline:none;padding:19px;font-family:Consolas,monospace;font-size:14px;line-height:1.65;direction:ltr;text-align:left;resize:vertical}
textarea:focus{border-color:#ff5555;box-shadow:0 0 25px rgba(255,30,30,.12)}
.actions{display:flex;gap:12px;margin-top:14px}
.file{height:52px;width:190px;border:1px solid rgba(255,80,80,.2);border-radius:15px;background:rgba(255,50,50,.06);display:flex;align-items:center;justify-content:center;color:#ffadad;font-size:13px;font-weight:800;cursor:pointer}
.file input{display:none}
.obfuscate{flex:1}
.result{display:none;margin-top:16px;padding:16px;border-radius:17px;border:1px solid rgba(255,70,70,.2);background:rgba(255,40,40,.045)}
.resultTitle{color:#ff9b9b;font-size:13px;font-weight:800;margin-bottom:10px}
.link{display:flex;gap:8px}
.link input{margin:0;height:47px;direction:ltr;font-family:Consolas;font-size:12px}
.copy{width:90px;border-radius:13px;background:#ff4f4f;color:#fff;font-weight:900}
.run{display:block;text-align:center;margin-top:10px;padding:12px;border-radius:12px;background:rgba(255,50,50,.07);color:#ff8c8c;font-size:11px;word-break:break-all}
@media(max-width:600px){.actions{flex-direction:column}.file{width:100%}.hero h1{font-size:32px}.container{margin-top:30px}}
</style>
</head>
<body>

<div class="login" id="login">
<div class="loginBox">
<div class="logo">SP HUB</div>
<div class="sub">منصة سكربتات روبلكس</div>
<label>اسم المستخدم</label>
<input id="user" placeholder="اسم المستخدم" autocomplete="off">
<label>كلمة المرور</label>
<input id="pass" type="password" placeholder="كلمة المرور">
<button class="loginBtn" id="loginBtn">دخول</button>
<div class="err" id="err"></div>
</div>
</div>

<div class="app" id="app">
<div class="nav">
<div class="brand">SP HUB</div>
<div class="account">مرحباً، تركس</div>
</div>

<div class="container">
<div class="hero">
<h1>مركز <span>السكربتات</span></h1>
<p>شوش سكربتك واحصل على رابط تشغيل خاص</p>
</div>

<div class="panel">
<div class="head">
<div class="title">حط سكربتك هنا</div>
<div class="state" id="state">جاهز</div>
</div>

<textarea id="code" placeholder="ضع كود Lua هنا..."></textarea>

<div class="actions">
<label class="file">
<input id="file" type="file" accept=".lua">
رفع ملف Lua
</label>
<button class="obfuscate" id="obfuscate">تشويش السكربت</button>
</div>

<div class="result" id="result">
<div class="resultTitle">تم إنشاء رابط RAW</div>
<div class="link">
<input id="raw" readonly>
<button class="copy" id="copy">نسخ</button>
</div>
<div class="run" id="run"></div>
</div>
</div>
</div>
</div>

<script>
const login=document.getElementById("login");
const app=document.getElementById("app");
const user=document.getElementById("user");
const pass=document.getElementById("pass");
const loginBtn=document.getElementById("loginBtn");
const err=document.getElementById("err");
const code=document.getElementById("code");
const file=document.getElementById("file");
const obfuscate=document.getElementById("obfuscate");
const state=document.getElementById("state");
const result=document.getElementById("result");
const raw=document.getElementById("raw");
const run=document.getElementById("run");
const copy=document.getElementById("copy");

loginBtn.onclick=()=>{
if(user.value.trim()==="تركس"&&pass.value==="هوب"){
login.style.display="none";
app.style.display="block";
}else{
err.textContent="اسم المستخدم أو كلمة المرور غير صحيحة";
}
};

file.onchange=async()=>{
if(!file.files.length)return;
const f=file.files[0];
if(!f.name.toLowerCase().endsWith(".lua")){
file.value="";
state.textContent="ملف غير صالح";
return;
}
code.value=await f.text();
state.textContent="تم رفع الملف";
};

code.oninput=()=>{
state.textContent=code.value.trim()?"الكود جاهز":"جاهز";
};

obfuscate.onclick=async()=>{
if(!code.value.trim()){
state.textContent="ضع الكود أولاً";
return;
}

obfuscate.disabled=true;
obfuscate.textContent="جاري التشويش...";
state.textContent="جاري المعالجة...";

try{
const response=await fetch("/api/obfuscate",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({source:code.value})
});

const data=await response.json();

if(!response.ok||!data.success){
throw new Error(data.message||"فشل التشويش");
}

const base=location.origin;
raw.value=base+data.raw;
run.textContent="رابط التشغيل: "+base+data.execute;
result.style.display="block";
state.textContent="تم بنجاح";
obfuscate.textContent="تشويش السكربت";
obfuscate.disabled=false;
}catch(e){
state.textContent="حدث خطأ";
obfuscate.textContent="تشويش السكربت";
obfuscate.disabled=false;
alert(e.message);
}
};

copy.onclick=async()=>{
await navigator.clipboard.writeText(raw.value);
copy.textContent="تم النسخ";
setTimeout(()=>copy.textContent="نسخ",1500);
};
</script>
</body>
</html>
