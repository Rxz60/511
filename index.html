<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SP HUB | سكربتات روبلكس</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:#080303;color:#fff;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:-30%;background:radial-gradient(circle at 20% 20%,rgba(255,55,55,.25),transparent 25%),radial-gradient(circle at 80% 30%,rgba(255,0,0,.2),transparent 25%),radial-gradient(circle at 50% 90%,rgba(255,70,70,.18),transparent 30%);filter:blur(35px);animation:bg 8s ease-in-out infinite alternate;z-index:-2}
body:after{content:"";position:fixed;inset:0;background:linear-gradient(135deg,rgba(255,30,30,.06),transparent 35%,rgba(255,0,0,.08));z-index:-1;pointer-events:none}
@keyframes bg{from{transform:scale(1) rotate(0deg)}to{transform:scale(1.12) rotate(5deg)}}
button,input,textarea{font-family:inherit}
.login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{width:390px;max-width:100%;padding:38px 30px;border:1px solid rgba(255,85,85,.45);border-radius:25px;background:rgba(20,3,3,.82);box-shadow:0 0 35px rgba(255,35,35,.2),inset 0 0 35px rgba(255,30,30,.05);backdrop-filter:blur(20px)}
.logo{text-align:center;font-size:38px;font-weight:900;color:#ff5555;text-shadow:0 0 25px rgba(255,50,50,.8);margin-bottom:8px}
.sub{text-align:center;color:#c9a5a5;margin-bottom:30px;font-size:13px}
.field{margin-bottom:16px}
.field label{display:block;margin-bottom:8px;color:#ffb0b0;font-size:13px}
.field input{width:100%;height:50px;border:1px solid rgba(255,80,80,.25);outline:none;border-radius:14px;padding:0 16px;background:rgba(255,255,255,.045);color:#fff;transition:.2s}
.field input:focus{border-color:#ff5555;box-shadow:0 0 20px rgba(255,50,50,.15)}
.login-btn,.ob-btn{width:100%;height:52px;border:0;border-radius:15px;background:linear-gradient(135deg,#ff6666,#e52323);color:#fff;font-size:15px;font-weight:900;cursor:pointer;box-shadow:0 0 25px rgba(255,40,40,.3);transition:.2s}
.login-btn:hover,.ob-btn:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(255,40,40,.5)}
.error{text-align:center;color:#ff7777;font-size:12px;margin-top:13px;min-height:15px}
.app{display:none;min-height:100vh}
.top{height:76px;border-bottom:1px solid rgba(255,80,80,.14);background:rgba(8,2,2,.72);backdrop-filter:blur(18px);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:10}
.brand{font-size:25px;font-weight:900;color:#ff5c5c;text-shadow:0 0 18px rgba(255,40,40,.6)}
.user{padding:9px 15px;border-radius:12px;background:rgba(255,55,55,.08);border:1px solid rgba(255,80,80,.18);font-size:12px;color:#ffb1b1}
.main{width:min(1100px,92%);margin:45px auto}
.hero{text-align:center;margin-bottom:35px}
.hero h1{font-size:44px;font-weight:900;text-shadow:0 0 35px rgba(255,40,40,.35)}
.hero h1 span{color:#ff5555}
.hero p{color:#b99595;margin-top:10px;font-size:14px}
.editor{border:1px solid rgba(255,75,75,.25);border-radius:25px;background:rgba(18,3,3,.78);box-shadow:0 0 50px rgba(255,25,25,.12),inset 0 0 35px rgba(255,40,40,.025);padding:20px;backdrop-filter:blur(20px)}
.editor-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.editor-title{font-size:16px;font-weight:800;color:#ffaaaa}
.status{font-size:11px;color:#ff7373;padding:7px 11px;border-radius:10px;background:rgba(255,55,55,.07);border:1px solid rgba(255,70,70,.13)}
.textarea-wrap{position:relative}
textarea{width:100%;height:400px;resize:vertical;outline:none;border-radius:18px;border:1px solid rgba(255,80,80,.2);background:#080303;color:#ffbebe;padding:20px;font-family:Consolas,monospace;font-size:14px;line-height:1.7;direction:ltr;text-align:left;box-shadow:inset 0 0 30px rgba(255,20,20,.04)}
textarea:focus{border-color:rgba(255,90,90,.55);box-shadow:0 0 25px rgba(255,30,30,.1),inset 0 0 30px rgba(255,20,20,.04)}
.bottom{display:flex;gap:12px;margin-top:15px}
.upload{flex:0 0 180px;height:52px;border-radius:15px;border:1px solid rgba(255,90,90,.25);background:rgba(255,50,50,.07);color:#ffb0b0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:700}
.upload:hover{background:rgba(255,50,50,.14);box-shadow:0 0 20px rgba(255,40,40,.12)}
.upload input{display:none}
.ob-btn{flex:1}
.result{display:none;margin-top:18px;border:1px solid rgba(255,75,75,.22);border-radius:18px;background:rgba(255,40,40,.045);padding:14px}
.result-top{display:flex;justify-content:space-between;align-items:center}
.raw{display:inline-flex;align-items:center;justify-content:center;padding:8px 12px;border-radius:10px;background:#ff4e4e;color:#fff;text-decoration:none;font-size:11px;font-weight:900;box-shadow:0 0 18px rgba(255,50,50,.25);cursor:pointer}
.raw:hover{box-shadow:0 0 28px rgba(255,50,50,.45)}
.result-text{color:#9e7777;font-size:12px}
.preview{display:none;margin-top:12px}
.preview textarea{height:250px}
.toast{position:fixed;bottom:25px;left:25px;background:#190606;border:1px solid rgba(255,80,80,.35);padding:12px 17px;border-radius:13px;color:#ffaaaa;font-size:12px;opacity:0;transform:translateY(20px);transition:.25s;z-index:50}
.toast.show{opacity:1;transform:translateY(0)}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);align-items:center;justify-content:center;z-index:40;padding:20px}
.modal-box{width:300px;max-width:100%;background:#120303;border:1px solid rgba(255,80,80,.4);border-radius:20px;padding:20px;box-shadow:0 0 40px rgba(255,30,30,.25)}
.modal-title{font-size:14px;color:#ff8888;margin-bottom:12px;font-weight:900}
.modal textarea{height:120px;font-size:13px}
.modal-close{width:100%;height:42px;margin-top:10px;border:0;border-radius:12px;background:#ff4e4e;color:#fff;font-weight:800;cursor:pointer}
@media(max-width:650px){.hero h1{font-size:32px}.bottom{flex-direction:column}.upload{flex:auto;width:100%}.top{padding:0 4%}.main{margin-top:30px}}
</style>
</head>
<body>

<section class="login" id="login">
<div class="login-box">
<div class="logo">SP HUB</div>
<div class="sub">منصة سكربتات روبلكس الاحترافية</div>
<div class="field">
<label>اسم المستخدم</label>
<input id="username" type="text" autocomplete="off" placeholder="اكتب اسم المستخدم">
</div>
<div class="field">
<label>كلمة المرور</label>
<input id="password" type="password" autocomplete="off" placeholder="اكتب كلمة المرور">
</div>
<button class="login-btn" id="loginBtn">دخول إلى SP HUB</button>
<div class="error" id="loginError"></div>
</div>
</section>

<section class="app" id="app">
<header class="top">
<div class="brand">SP HUB</div>
<div class="user">مرحباً، تركس</div>
</header>

<main class="main">
<div class="hero">
<h1>مركز <span>السكربتات</span></h1>
<p>أدخل سكربتك أو ارفع ملف Lua لتحويله إلى نسخة مشوشة</p>
</div>

<div class="editor">
<div class="editor-head">
<div class="editor-title">حط سكربتك هنا</div>
<div class="status" id="status">جاهز</div>
</div>

<div class="textarea-wrap">
<textarea id="source" spellcheck="false" placeholder="ضع كود Lua هنا..."></textarea>
</div>

<div class="bottom">
<label class="upload">
<input id="file" type="file" accept=".lua,text/plain">
<span>رفع ملف Lua</span>
</label>
<button class="ob-btn" id="obfuscate">تشويش السكربت</button>
</div>

<div class="result" id="result">
<div class="result-top">
<div class="result-text">تم تجهيز النسخة المشوشة</div>
<div class="raw" id="rawBtn">RAW</div>
</div>
<div class="preview" id="preview">
<textarea id="output" readonly spellcheck="false"></textarea>
</div>
</div>
</div>
</main>
</section>

<div class="modal" id="modal">
<div class="modal-box">
<div class="modal-title">الصفحة غير موجودة: 404</div>
<textarea id="fake404" spellcheck="false">Page not found: 404</textarea>
<button class="modal-close" id="closeModal">إغلاق</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const login=document.getElementById("login");
const app=document.getElementById("app");
const username=document.getElementById("username");
const password=document.getElementById("password");
const loginBtn=document.getElementById("loginBtn");
const loginError=document.getElementById("loginError");
const source=document.getElementById("source");
const file=document.getElementById("file");
const obfuscate=document.getElementById("obfuscate");
const result=document.getElementById("result");
const output=document.getElementById("output");
const status=document.getElementById("status");
const rawBtn=document.getElementById("rawBtn");
const modal=document.getElementById("modal");
const closeModal=document.getElementById("closeModal");
const toast=document.getElementById("toast");

loginBtn.addEventListener("click",async()=>{
if(username.value.trim()==="تركس"&&password.value==="هوب"){
login.style.display="none";
app.style.display="block";
}else{
loginError.textContent="اسم المستخدم أو كلمة المرور غير صحيحة";
}
});

password.addEventListener("keydown",async e=>{
if(e.key==="Enter")loginBtn.click();
});

file.addEventListener("change",async()=>{
if(!file.files.length)return;
const selected=file.files[0];
if(!selected.name.toLowerCase().endsWith(".lua")){
file.value="";
status.textContent="الملف غير صالح";
toast.textContent="يسمح برفع ملفات Lua فقط";
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),2200);
return;
}
source.value=await selected.text();
status.textContent="تم رفع الملف";
});

source.addEventListener("input",()=>{
if(source.value.trim())status.textContent="الكود جاهز";
else status.textContent="جاهز";
});

obfuscate.addEventListener("click",async()=>{
if(!source.value.trim()){
status.textContent="لا يوجد كود";
toast.textContent="ضع كود Lua أولاً";
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),2200);
return;
}

status.textContent="جاري التشويش...";
obfuscate.disabled=true;
obfuscate.textContent="جاري المعالجة...";

try{
const response=await fetch("https://api.hendar.dev/v1/obfuscate",{
method:"POST",
headers:{
"Content-Type":"application/json",
"Authorization":"Bearer YOUR_API_KEY"
},
body:JSON.stringify({
source:source.value,
preset:"Medium",
luaVersion:"Lua51"
})
});

const data=await response.json();
const code=data.obfuscated||data.code||data.output||data.result||data.data?.obfuscated||data.data?.code||data.data?.output;

if(!response.ok||!code)throw new Error(data.message||"تعذر الحصول على الكود المشوش");

output.value=typeof code==="string"?code:JSON.stringify(code,null,2);
result.style.display="block";
status.textContent="تم التشويش بنجاح";
obfuscate.textContent="تشويش السكربت";
obfuscate.disabled=false;
}catch(e){
status.textContent="حدث خطأ";
obfuscate.textContent="تشويش السكربت";
obfuscate.disabled=false;
toast.textContent=e.message||"تعذر الاتصال بالخدمة";
toast.classList.add("show");
setTimeout(()=>toast.classList.remove("show"),3000);
}
});

rawBtn.addEventListener("click",()=>{
modal.style.display="flex";
});

closeModal.addEventListener("click",()=>{
modal.style.display="none";
});

modal.addEventListener("click",e=>{
if(e.target===modal)modal.style.display="none";
});
</script>
</body>
</html>
